          (app/'ScalpingTradeMonitor.swift').write_text(r'''// ScalpingTradeMonitor.swift - V10.6 coordinated EA/app trade management
import Foundation

actor ScalpingTradeMonitor {
    private var activeTrades: [UUID: TradeRecord] = [:]
    private var tradeEntryIndicators: [UUID: IndicatorSet] = [:]
    private var partialStages: [UUID: Int] = [:]
    private let marketData: MarketDataProvider
    private let tradeHistory: RefactoredTradeHistoryManager
    private let signalEngine: ScalpingSignalEngine
    private var onPendingReconciliation: ((TradeRecord) async -> Void)?
    private var onTradeClosed: ((TradeRecord) async -> Void)?
    private var onPartialClose: ((TradeRecord) async -> Void)?
    init(marketData: MarketDataProvider, tradeHistory: RefactoredTradeHistoryManager, signalEngine: ScalpingSignalEngine, config: ScalpingConfig) { self.marketData=marketData; self.tradeHistory=tradeHistory; self.signalEngine=signalEngine }
    func updatePrice(symbol: String, price: Double, indicators: IndicatorSet?) async {
        for trade in activeTrades.values.filter({$0.symbol == symbol}) {
            let pips = profitPips(trade, price); let profitable = pips > 0
            await managePartialsAndRunner(trade: trade, price: price, profitPips: pips)
            if profitable { continue }
            if await checkTimeExit(trade) { await closeTrade(trade, reason: "Time Expiry (unprofitable)"); continue }
            if let indicators, await shouldExitViaIndicatorReversal(trade, indicators: indicators) { await closeTrade(trade, reason: "Indicator Reversal (unprofitable)"); continue }
            if await emergency(trade, price) { await closeTrade(trade, reason: "Emergency Fallback") }
        }
    }
    private func managePartialsAndRunner(trade: TradeRecord, price: Double, profitPips: Double) async {
        guard let id=trade.externalDealId, let ticket=Int64(id), let original=trade.originalVolume ?? trade.positionSize, original > 0 else{return}
        let c=await MainActor.run{ScalpingConfig.shared}; var stage=partialStages[trade.id] ?? 0
        if stage<1 && profitPips >= c.partialTP1_Pips { if await partial(ticket, original*c.partialTP1_Percent, stage:1, symbol:trade.symbol){stage=1;partialStages[trade.id]=1;await protect(trade,ticket,price)} }
        if stage<2 && profitPips >= c.partialTP2_Pips { if await partial(ticket, original*c.partialTP2_Percent, stage:2, symbol:trade.symbol){stage=2;partialStages[trade.id]=2;await protect(trade,ticket,price)} }
        if profitPips >= 5 {
            let d = profitPips>=30 ? 10.0 : profitPips>=20 ? 8.0 : profitPips>=10 ? 6.0 : 4.0
            let pip=trade.symbol.contains("JPY") ? 0.01 : 0.0001
            let sl=trade.type == .buy ? price-d*pip : price+d*pip
            try? await MT5Service.shared.modifyPosition(ticket:ticket,sl:sl,tp:trade.takeProfit ?? 0)
            godLog("🛡️ TRAILING SL | \(trade.symbol) | profit=\(String(format:"%.1f",profitPips))p | distance=\(d)p | SL=\(String(format:"%.5f",sl))",level:.diagnostic)
        }
        if stage>=2 && profitPips >= c.partialTP3_Pips { _=try? await MT5Service.shared.modifyPosition(ticket:ticket,sl:trade.stopLoss ?? 0,tp:0); godLog("🏃 RUNNER ACTIVE | \(trade.symbol) | TP removed | unlimited hold with trailing SL",level:.success) }
    }
    private func partial(_ ticket:Int64,_ volume:Double,stage:Int,symbol:String) async -> Bool { let v=max(0.01,(volume*100).rounded()/100); do { if try await MT5Service.shared.closePosition(ticket:ticket,volume:v){godLog("💰 PARTIAL TP\(stage) | \(symbol) | closed=\(String(format:"%.2f",v)) lots",level:.success); NotificationCenter.default.post(name:.tradePartiallyClosed,object:symbol); return true} }catch{godLog("⚠️ PARTIAL TP\(stage) failed | \(symbol) | \(error.localizedDescription)",level:.warning)}; return false }
    private func protect(_ trade:TradeRecord,_ ticket:Int64,_ price:Double) async { let pip=trade.symbol.contains("JPY") ? 0.01 : 0.0001; let sl=trade.type == .buy ? trade.entryPrice+pip : trade.entryPrice-pip; try? await MT5Service.shared.modifyPosition(ticket:ticket,sl:sl,tp:trade.takeProfit ?? 0) }
    private func profitPips(_ trade:TradeRecord,_ price:Double)->Double { let pip=trade.symbol.contains("JPY") ? 0.01 : 0.0001; return trade.type == .buy ? (price-trade.entryPrice)/pip : (trade.entryPrice-price)/pip }
    private func emergency(_ trade:TradeRecord,_ price:Double) async -> Bool { guard let sl=trade.stopLoss else{return false}; let pip=trade.symbol.contains("JPY") ? 0.01 : 0.0001; return trade.type == .buy ? price <= sl-5*pip : price >= sl+5*pip }
    private func shouldExitViaIndicatorReversal(_ trade:TradeRecord,indicators:IndicatorSet) async -> Bool { guard await MainActor.run({ScalpingConfig.shared.enableIndicatorExit}),let e=tradeEntryIndicators[trade.id] else{return false}; if trade.type == .buy{return (indicators.rsi>70 && indicators.rsi<e.rsi-3)||(indicators.bbPosition>1 && indicators.stochasticK>80)}; return (indicators.rsi<30 && indicators.rsi>e.rsi+3)||(indicators.bbPosition<0 && indicators.stochasticK<20) }
    private func checkTimeExit(_ trade:TradeRecord) async -> Bool { let m=await MainActor.run{ScalpingConfig.shared.maxHoldMinutes}; return Date().timeIntervalSince(trade.entryTime)>m*60 }
    private func closeTrade(_ trade:TradeRecord,reason:String) async { guard let id=trade.externalDealId,let t=Int64(id) else{return}; godLog("🎯 EXIT FALLBACK | \(trade.symbol) | reason=\(reason)",level:.info); _=try? await MT5Service.shared.closePosition(ticket:t) }
    func addTrade(_ trade:TradeRecord,indicators:IndicatorSet?){var c=trade;c.originalVolume=trade.positionSize;c.remainingVolume=trade.positionSize;activeTrades[trade.id]=c;partialStages[trade.id]=0;if let indicators{tradeEntryIndicators[trade.id]=indicators};godLog("📊 Trade opened: \(trade.symbol) \(trade.type) @ \(trade.entryPrice)",level:.trade)}
    func removeTrade(id:UUID){activeTrades.removeValue(forKey:id);tradeEntryIndicators.removeValue(forKey:id);partialStages.removeValue(forKey:id)}
    func getActiveTrades()->[TradeRecord]{Array(activeTrades.values)}
    func getLastTradeTime(symbol:String)->Date?{activeTrades.values.filter{$0.symbol==symbol}.map{$0.entryTime}.max()}
    func setPendingReconciliationCallback(_ callback:@escaping(TradeRecord)async->Void){onPendingReconciliation=callback}
    func setOnTradeClosedCallback(_ callback:@escaping(TradeRecord)async->Void){onTradeClosed=callback}
    func setOnPartialCloseCallback(_ callback:@escaping(TradeRecord)async->Void){onPartialClose=callback}
}
''')
