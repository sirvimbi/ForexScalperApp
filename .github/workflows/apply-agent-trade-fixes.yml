 func sendSignalNotification(_ s:Signal){guard isAuthorized else{return};let k:SoundKind=s.confidence>=85 ? .jackpot : s.confidence>=80 ? .urgent : .passive;let c=UNMutableNotificationContent();c.title="🚨 \(s.symbol) \(s.type.displayName) SIGNAL";c.body=String(format:"Price: %.5f | Confidence: %.0f%% | Expires: %@",s.price,s.confidence,fmt(s.expiryTime));c.sound=sound(k);c.interruptionLevel=s.confidence>=80 ? .timeSensitive : .active;UNUserNotificationCenter.current().add(UNNotificationRequest(identifier:"signal_\(s.id)",content:c,trigger:UNTimeIntervalNotificationTrigger(timeInterval:1,repeats:false)));foreground(k)}
 func sendTradeClosedNotification(_ t:TradeRecord){guard isAuthorized,t.status == .completed,(t.remainingVolume ?? 0)<=0 else{return};let p=t.pnl ?? 0,k:SoundKind=p>=0 ? .win:.loss;let c=UNMutableNotificationContent();c.title="\(p>=0 ? "✅":"❌") \(t.symbol) Trade Closed";c.body=String(format:"P&L: %@KES %.2f (%.2f%%)",p>=0 ? "+":"",p,t.pnlPercent ?? 0);c.sound=sound(k);UNUserNotificationCenter.current().add(UNNotificationRequest(identifier:"trade_\(t.id)",content:c,trigger:UNTimeIntervalNotificationTrigger(timeInterval:1,repeats:false)));foreground(k)}
 func sendPartialCloseNotification(symbol:String){guard isAuthorized else{return};let c=UNMutableNotificationContent();c.title="💰 \(symbol) Partial Close";c.body="Partial TP executed; remaining position is protected by trailing SL.";c.sound=sound(.partial);UNUserNotificationCenter.current().add(UNNotificationRequest(identifier:"partial_\(symbol)_\(UUID())",content:c,trigger:UNTimeIntervalNotificationTrigger(timeInterval:1,repeats:false)));foreground(.partial)}
 private func fmt(_ d:Date)->String{let f=DateFormatter();f.dateFormat="HH:mm:ss";return f.string(from:d)}
 func removeAllNotifications(){UNUserNotificationCenter.current().removeAllDeliveredNotifications();UNUserNotificationCenter.current().removeAllPendingNotificationRequests()}
 func sendTestNotification(){let c=UNMutableNotificationContent();c.title="Stellas System Check";c.body="Notification pipe is active.";c.sound=.default;UNUserNotificationCenter.current().add(UNNotificationRequest(identifier:"system_test_\(UUID())",content:c,trigger:nil))}
}
extension NotificationManager:@preconcurrency UNUserNotificationCenterDelegate{func userNotificationCenter(_ c:UNUserNotificationCenter,willPresent n:UNNotification,withCompletionHandler h:@escaping(UNNotificationPresentationOptions)->Void){h([.banner,.sound,.badge])};func userNotificationCenter(_ c:UNUserNotificationCenter,didReceive r:UNNotificationResponse,withCompletionHandler h:@escaping()->Void){if r.notification.request.identifier.hasPrefix("signal_"){NotificationCenter.default.post(name:.showSignalDashboard,object:nil)};h()}}
