#endif
@MainActor
class NotificationManager:NSObject,ObservableObject{
 static let shared=NotificationManager();@Published var isAuthorized=false
 enum SoundKind{case jackpot,urgent,passive,win,loss,partial}
 private override init(){super.init();_ = TradeNotificationBridge.shared;UNUserNotificationCenter.current().delegate=self;requestAuthorization()}
 func requestAuthorization(){UNUserNotificationCenter.current().requestAuthorization(options:[.alert,.sound,.badge]){g,_ in Task{@MainActor in self.isAuthorized=g}}}
 private func sound(_ k:SoundKind)->UNNotificationSound{let n:String;switch k{case .jackpot:n="jackpot.aiff";case .urgent:n="urgent.aiff";case .passive:n="passive.aiff";case .win:n="win.aiff";case .loss:n="loss.aiff";case .partial:n="partial.aiff"};return UNNotificationSound(named:UNNotificationSoundName(n))}
