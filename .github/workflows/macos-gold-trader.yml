name: macOS Gold Trader Build

on:
  pull_request:
    paths:
      - 'MacGoldTrader/**'
      - '.github/workflows/macos-gold-trader.yml'
  push:
    branches:
      - main
    paths:
      - 'MacGoldTrader/**'
      - '.github/workflows/macos-gold-trader.yml'

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: MacGoldTrader
    steps:
      - uses: actions/checkout@v4
      - name: Build release executable
        run: swift build -c release
