name: Apply signal accuracy integration

on:
  push:
    branches:
      - agent/phase1-3-signal-accuracy-and-daily-news-insight
    paths:
      - '.github/workflows/apply-signal-accuracy-integration.yml'
      - '.github/automation/apply_signal_accuracy.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/phase1-3-signal-accuracy-and-daily-news-insight
          fetch-depth: 0

      - name: Apply source integration
        run: python3 .github/automation/apply_signal_accuracy.py

      - name: Build validation
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project ForexScalperApp.xcodeproj \
            -scheme ForexScalperApp \
            -configuration Debug \
            -sdk macosx \
            -derivedDataPath /tmp/ForexScalperAppDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/forexscalper-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-accuracy-build-log
          path: /tmp/forexscalper-build.log
          if-no-files-found: warn

      - name: Stop if build failed
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/automation/apply_signal_accuracy.py .github/workflows/apply-signal-accuracy-integration.yml
          git add -A
          git commit -m "feat: integrate signal accuracy gates and daily news intelligence [bot]"
          git push origin agent/phase1-3-signal-accuracy-and-daily-news-insight
