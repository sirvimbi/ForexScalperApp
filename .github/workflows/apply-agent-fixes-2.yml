name: Apply agent fixes 2
on:
  push:
    branches: [agent/secure-trade-management-and-settings]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python3 .github/patch_agent_fixes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ForexScalperApp .github
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply secure trade management fixes"
          git push
