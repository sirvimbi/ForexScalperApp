name: Apply Settings Layout Fix
on:
  push:
permissions:
  contents: write
jobs:
  transform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Transform fix branch
        shell: bash
        run: |
          git fetch origin fix/settings-scroll-layout
          git checkout fix/settings-scroll-layout
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ForexScalperApp/SettingsView.swift')
          s = p.read_text()
          start = s.index('                    LazyVGrid(columns: [')
          open_pos = s.index('{', start)
          depth = 0
          end = None
          for i in range(open_pos, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      j = i + 1
                      while j < len(s) and s[j] in ' \t': j += 1
                      end = j + len('.padding(24)') if s.startswith('.padding(24)', j) else i + 1
                      break
          if end is None: raise SystemExit('grid end not found')
          body_start = open_pos + 1
          d = 0; body_end = None
          for i in range(open_pos, len(s)):
              if s[i] == '{': d += 1
              elif s[i] == '}':
                  d -= 1
                  if d == 0: body_end = i; break
          body = s[body_start:body_end]
          marker = '], alignment: .leading, spacing: 20)'
          cols_end = body.index(marker) + len(marker)
          children_text = body[cols_end:]
          children = []
          i = 0
          while i < len(children_text):
              while i < len(children_text) and children_text[i].isspace(): i += 1
              if i >= len(children_text): break
              st = i
              if children_text.startswith('VStack', i):
                  brace = children_text.index('{', i); d = 0
                  for k in range(brace, len(children_text)):
                      if children_text[k] == '{': d += 1
                      elif children_text[k] == '}':
                          d -= 1
                          if d == 0: endi = k + 1; break
                  children.append(children_text[st:endi].strip()); i = endi
              elif children_text.startswith('RunnerContinuationSettingsCard', i):
                  nl = children_text.find('\n', i); endi = len(children_text) if nl < 0 else nl
                  children.append(children_text[st:endi].strip()); i = endi
              else: raise SystemExit('unexpected grid child: ' + children_text[i:i+80])
          flat = []
          for child in children:
              if child.startswith('VStack'):
                  brace = child.index('{'); inner = child[brace+1:-1]
                  i = 0
                  while i < len(inner):
                      while i < len(inner) and inner[i].isspace(): i += 1
                      if i >= len(inner): break
                      st = i
                      if inner.startswith('GlassCard', i):
                          brace2 = inner.index('{', i); d = 0
                          for k in range(brace2, len(inner)):
                              if inner[k] == '{': d += 1
                              elif inner[k] == '}':
                                  d -= 1
                                  if d == 0: endi = k + 1; break
                          flat.append(inner[st:endi].strip()); i = endi
                      elif inner.startswith('V22TrailingActivationSettingsCard', i):
                          nl = inner.find('\n', i); endi = len(inner) if nl < 0 else nl
                          flat.append(inner[st:endi].strip()); i = endi
                      else: raise SystemExit('unexpected nested settings card: ' + inner[i:i+100])
              else: flat.append(child)
          if len(flat) != 9: raise SystemExit(f'expected 9 settings cards, found {len(flat)}')
          new = '''                    LazyVGrid(columns: [\n                        GridItem(.flexible(minimum: 280), spacing: 20),\n                        GridItem(.flexible(minimum: 420), spacing: 20),\n                        GridItem(.flexible(minimum: 280), spacing: 20)\n                    ], alignment: .leading, spacing: 20) {\n'''
          for card in flat:
              new += '                        ' + card.replace('\n', '\n                        ') + '\n'
          new += '                    }.padding(24)'
          s = s[:start] + new + s[end:]
          old = '''                                    ScrollView {\n                                        VStack(alignment: .leading, spacing: 16) {'''
          if old not in s: raise SystemExit('active-pairs nested ScrollView anchor not found')
          s = s.replace(old, '''                                    VStack(alignment: .leading, spacing: 16) {''', 1)
          old2 = '''                                        }\n                                    }\n                                    .frame(maxHeight: 250)'''
          if old2 not in s: raise SystemExit('active-pairs ScrollView closing anchor not found')
          s = s.replace(old2, '''                                    }\n                                    .frame(maxHeight: 250)\n                                    .clipped()''', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ForexScalperApp/SettingsView.swift
          git commit -m "fix: stabilize and rebalance settings layout"
          git push origin fix/settings-scroll-layout
      - name: Remove temporary workflow from main
        if: always()
        run: |
          git checkout main
          git rm .github/workflows/settings-layout-fix.yml || true
          git commit -m "chore: remove temporary settings layout workflow" || true
          git push origin main || true
