name: Wire Runner Settings UI

on:
  push:
    branches: [fix/runner-settings-ui]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert runner settings below scalping configuration
        shell: python
        run: |
          from pathlib import Path
          p = Path('ForexScalperApp/SettingsView.swift')
          s = p.read_text()

          card_ref = 'RunnerContinuationSettingsCard(config: viewModel.scalpingConfig)'
          scalping = s.find('sectionHeader("SCALPING CONFIGURATION"')
          if scalping < 0:
              raise SystemExit('SCALPING CONFIGURATION anchor not found')

          # The desktop scalping card ends at the first padding/GlassCard close after its header.
          card_end = s.find('                                }.padding(16)\n                            }', scalping)
          if card_end < 0:
              raise SystemExit('scalping card closing sequence not found')

          insert_at = card_end + len('                                }.padding(16)\n                            }')
          if card_ref not in s[scalping:insert_at + 300]:
              s = s[:insert_at] + '\n                            ' + card_ref + s[insert_at:]

          # iOS Settings Form: put the same card immediately below the scalping section.
          ios_anchor = '                scalpingConfigSection\n                elitePrecisionSection'
          if ios_anchor in s and '                runnerContinuationSection\n' not in s:
              s = s.replace(ios_anchor, '                scalpingConfigSection\n                runnerContinuationSection\n                elitePrecisionSection', 1)

          marker = '    private var scalpingConfigSection: some View {'
          if marker in s and '    private var runnerContinuationSection: some View {' not in s:
              section = '''    private var runnerContinuationSection: some View {\n        Section("RUNNER CONTINUATION") {\n            RunnerContinuationSettingsCard(config: viewModel.scalpingConfig)\n        }\n    }\n\n'''
              s = s.replace(marker, section + marker, 1)

          p.write_text(s)

      - name: Commit SettingsView change and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ForexScalperApp/SettingsView.swift
          git rm .github/workflows/wire-runner-settings-ui.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: place runner continuation settings below scalping configuration"
          git push
