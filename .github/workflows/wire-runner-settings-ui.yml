name: Wire Runner Settings UI

on:
  push:
    branches: [fix/runner-settings-ui]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert runner settings below scalping configuration
        shell: python
        run: |
          from pathlib import Path
          p = Path('ForexScalperApp/SettingsView.swift')
          s = p.read_text()

          card = '''                            RunnerContinuationSettingsCard(config: viewModel.scalpingConfig)\n'''
          anchor = '''                                }.padding(16)\n                            }\n                            VStack(spacing: 20) {'''

          scalping = s.find('sectionHeader("SCALPING CONFIGURATION"')
          if scalping < 0:
              raise SystemExit('SCALPING CONFIGURATION anchor not found')

          pos = s.find(anchor, scalping)
          if pos < 0:
              raise SystemExit('end of scalping configuration card not found')

          if 'RunnerContinuationSettingsCard(config: viewModel.scalpingConfig)' not in s[scalping:pos + len(anchor) + 500]:
              replacement = '''                                }.padding(16)\n                            }\n                            RunnerContinuationSettingsCard(config: viewModel.scalpingConfig)\n                            VStack(spacing: 20) {'''
              s = s[:pos] + s[pos:].replace(anchor, replacement, 1)

          ios_anchor = '''                scalpingConfigSection\n                elitePrecisionSection'''
          if ios_anchor in s and 'runnerContinuationSection' not in s:
              s = s.replace(ios_anchor, '''                scalpingConfigSection\n                runnerContinuationSection\n                elitePrecisionSection''', 1)

          # Add the iOS Form section using the same card content where the project supports it.
          marker = '''    private var scalpingConfigSection: some View {'''
          if marker in s and 'private var runnerContinuationSection' not in s:
              section = '''    private var runnerContinuationSection: some View {\n        Section("RUNNER CONTINUATION") {\n            RunnerContinuationSettingsCard(config: viewModel.scalpingConfig)\n        }\n    }\n\n'''
              s = s.replace(marker, section + marker, 1)

          p.write_text(s)

      - name: Commit SettingsView change and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ForexScalperApp/SettingsView.swift
          git rm .github/workflows/wire-runner-settings-ui.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: place runner continuation settings below scalping configuration"
          git push
