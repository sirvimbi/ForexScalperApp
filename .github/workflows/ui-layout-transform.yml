name: Apply Settings UI Layout
on:
  push:
    branches:
      - fix/settings-three-column-layout
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Transform settings layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ForexScalperApp/SettingsView.swift')
          s = p.read_text()
          old = '                    HStack(alignment: .top, spacing: 24) {'
          new = '''                    LazyVGrid(columns: [\n                        GridItem(.flexible(minimum: 280), spacing: 20),\n                        GridItem(.flexible(minimum: 400), spacing: 20),\n                        GridItem(.flexible(minimum: 280), spacing: 20)\n                    ], alignment: .leading, spacing: 20) {'''
          if old not in s:
              raise SystemExit('Expected settings grid anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit layout-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ForexScalperApp/SettingsView.swift
          git commit -m "ui: arrange settings cards in three-column layout"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/ui-layout-transform.yml
          git commit -m "chore: remove temporary UI transform workflow"
          git push
